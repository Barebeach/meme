[phases.setup]
nixPkgs = ["nodejs_20"]
nixLibs = ["nodejs_20"]

[phases.install]
cmds = [
  "npm install --legacy-peer-deps --ignore-scripts",
  "chmod +x node_modules/@ffmpeg-installer/*/ffmpeg 2>/dev/null || true",
  "chmod +x node_modules/@ffprobe-installer/*/ffprobe 2>/dev/null || true"
]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "npm start"

